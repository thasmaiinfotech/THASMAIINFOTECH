rtDate":"2026-01-01","endDate":"2026-12-30","organizer":{"@id":"https://www.thasmaiinfotech.com/#organization"}},{"@type":"CourseInstance","name":"2027 Batch","startDate":"2027-01-01","endDate":"2027-12-30","organizer":{"@id":"https://www.thasmaiinfotech.com/#organization"}}]},{"@type":"BreadcrumbList","@id":"https://www.thasmaiinfotech.com/space-research#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://www.thasmaiinfotech.com/"},{"@type":"ListItem","position":2,"name":"Space Research","item":"https://www.thasmaiinfotech.com/space-research"}]},{"@type":"FAQPage","@id":"https://www.thasmaiinfotech.com/space-research#faq","mainEntity":[{"@type":"Question","name":"What is the CanSat & Model Rocketry Engineering Program?","acceptedAnswer":{"@type":"Answer","text":"It is a 12-month engineering program from THASMAI Space Research that takes students from satellite and rocketry fundamentals through simulation, hardware development, telemetry, system integration, testing, flight and competition readiness."}},{"@type":"Question","name":"Who can join?","acceptedAnswer":{"@type":"Answer","text":"It is a student engineering program for students who want to work hands-on across space systems, electronics, embedded software and mechanical design. Eligibility and intake for each annual batch are confirmed by the program lead."}},{"@type":"Question","name":"How long is the program?","acceptedAnswer":{"@type":"Answer","text":"12 months. It runs as an annual cycle from January to December, organised into four quarters."}},{"@type":"Question","name":"When was the program started?","acceptedAnswer":{"@type":"Answer","text":"The program was initiated on 01 December 2025. The first batch is the 2026 batch, running from 01 January 2026 to 30 December 2026."}},{"@type":"Question","name":"What happens during Q1, Q2, Q3 and Q4?","acceptedAnswer":{"@type":"Answer","text":"Q1 (January to March) covers space and flight engineering foundations. Q2 (April to June) covers design, simulation and digital engineering, including CubeTwin. Q3 (July to September) is the build, integration and validation quarter, with hands-on workshops and lab work. Q4 (October to December) covers flight, mission analysis and competition readiness."}},{"@type":"Question","name":"Will students build a real CanSat?","acceptedAnswer":{"@type":"Answer","text":"Yes. The Q3 Build a CanSat workshop covers the mechanical structure, flight computer, sensors, power, telemetry, payload, firmware, recovery system and ground station, and an integrated CanSat is one of the planned Q3 outputs."}},{"@type":"Question","name":"Will students build a model rocket?","acceptedAnswer":{"@type":"Answer","text":"Yes. The Q3 Build a Model Rocket workshop covers the airframe, nose cone, fins, stability, recovery system, payload bay and CanSat integration. Propulsion is covered as an educational, safety-oriented subject using approved educational and commercially appropriate systems."}},{"@type":"Question","name":"Does the program prepare students for IN-SPACe competitions?","acceptedAnswer":{"@type":"Answer","text":"The program builds competition readiness: the technical, documentation, teamwork, mission-design and flight-readiness skills that student aerospace competitions require. Students may have opportunities to prepare for and participate in relevant IN-SPACe competitions, subject to the official competition announcement, team eligibility, institution requirements, application and selection, current-year rules and safety requirements. THASMAI does not conduct IN-SPACe competitions."}},{"@type":"Question","name":"Can students participate in international competitions?","acceptedAnswer":{"@type":"Answer","text":"Potential competition pathways depend on current eligibility rules. Not all international competitions are open to Indian teams, and international participation is not promised. International competitions are referenced as benchmarks for engineering practice."}},{"@type":"Question","name":"Is competition participation guaranteed?","acceptedAnswer":{"@type":"Answer","text":"No. Participation depends on official announcements, eligibility, selection and the organiser's rules for that year. The program focuses on competition readiness."}},{"@type":"Question","name":"What is CubeTwin?","acceptedAnswer":{"@type":"Answer","text":"CubeTwin is a digital engineering / digital-twin learning platform used in the program to model and analyse mission behaviour before and after physical testing. Students work through a loop of digital model, simulation, physical build, flight data, comparison and model improvement."}},{"@type":"Question","name":"What are the career and research pathways?","acceptedAnswer":{"@type":"Answer","text":"The program builds skills relevant to satellite engineering, space systems engineering, avionics, telemetry, embedded systems, ground systems, mission operations, digital twins, aerospace cybersecurity, research and higher studies, and space-tech startups. These are possible pathways, not placement commitments."}},{"@type":"Question","name":"How can I know the program fees?","acceptedAnswer":{"@type":"Answer","text":"Program fees are not published on this page. Contact the program lead, Sudarshana Karkala, for program details and fees."}},{"@type":"Question","name":"Who is the program lead?","acceptedAnswer":{"@type":"Answer","text":"Sudarshana Karkala, Co-Founder & Executive Director of THASMAI INFOTECH PRIVATE LIMITED, is the program lead and contact person."}}]}]}</script>
